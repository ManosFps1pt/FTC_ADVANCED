name: Software verification
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r web_driver_station/backend/requirements.txt -r mcp_server/requirements.txt
      - run: python -m unittest discover -s web_driver_station/backend -t . -p 'test_*.py'
      - run: python -m unittest test_ftc_control_hub test_ftc_local_config recording_viewer.backend.test_recording_reader mcp_server.test_backend_client mcp_server.test_server_profiles
      - name: Verify generated schema fingerprint
        run: python -c "import hashlib,pathlib; p=pathlib.Path('protocol'); assert hashlib.sha256((p/'robot_data.proto').read_bytes()).hexdigest() == (p/'schema.sha256').read_text().strip()"
  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web_driver_station/frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        with:
          version: '10.17.1'
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
